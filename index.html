<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BCP – IKT-beredskap (ISO 27001 A.5.30)</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">BCP</span>
      <div class="brand-text">
        <strong>IKT-beredskapsplan</strong>
        <small>ISO/IEC 27001 – Annex A 5.30</small>
      </div>
    </div>
    <div class="org">
      <label for="orgName">Virksomhet</label>
      <input id="orgName" type="text" placeholder="Skriv inn navn på virksomheten" autocomplete="off" />
    </div>
    <div class="topbar-actions">
      <button id="btnExport" class="btn btn-ghost" title="Last ned alle data som JSON-fil">Eksporter</button>
      <button id="btnImport" class="btn btn-ghost" title="Last inn data fra JSON-fil">Importer</button>
      <input id="fileImport" type="file" accept="application/json,.json" hidden />
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Hovedmeny">
      <button class="nav-item" data-view="oversikt"><span class="nav-ico">▦</span> Oversikt</button>
      <button class="nav-item" data-view="prosesser"><span class="nav-ico">▤</span> Prosesser</button>
      <button class="nav-item" data-view="systemer"><span class="nav-ico">▣</span> Systemer</button>
      <button class="nav-item" data-view="bia"><span class="nav-ico">◆</span> BIA</button>
      <button class="nav-item" data-view="planer"><span class="nav-ico">▷</span> Gjenopprettingsplaner</button>
      <button class="nav-item" data-view="tester"><span class="nav-ico">✓</span> Tester &amp; øvelser</button>
      <div class="sidebar-foot">
        <small>Data lagres kun i denne nettleseren. Husk å eksportere for sikkerhetskopi.</small>
      </div>
    </nav>

    <main id="content" class="content" tabindex="-1"></main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
